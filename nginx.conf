server {
    listen 80;
    
    # 1. STOP NGINX FROM EVER USING THE IP IN REDIRECTS
    absolute_redirect off;
    server_name_in_redirect off;
    port_in_redirect off;

    # 2. FRONTEND
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 3. SEARXNG (The likely source of that 308)
    location /search {
        # Adding the trailing slash to the proxy_pass helps prevent Nginx 
        # from issuing a redirect if the JS calls /search without a slash.
        proxy_pass http://searxng:8080/; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # REWRITE the Location header if the backend tries to send the IP
        proxy_redirect http://5.83.153.144:9002/ /;
        proxy_redirect http://searxng:8080/ /;
    }

    # 4. AI BACKEND
    location /api/ {
        proxy_pass http://192.168.0.1:9003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Rewrite any redirects from Node too
        proxy_redirect http://192.168.0.1:9003/ /api/;
    }
}

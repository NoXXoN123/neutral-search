<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="darkreader-lock">
    <meta name="description" content="Neutral Search - a dark, minimalist search frontend with AI overview.">
    <title>Neutral Search</title>
    
    <link rel="search" type="application/opensearchdescription+xml" title="Neutral Search" href="/opensearch.xml">

    <style>
        /* Added weight 300 for the thin logo */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap');

        :root {
            color-scheme: dark;
            --bg: #000000;
            --bg-soft: #131416;
            --text: #f5f5f5;
            --muted: #a3a3a3;
            --muted-soft: #5f6368;
            --blue: #add8e6; 
            --google-blue: #ADD8E6; 
            --danger: #fca5a5;
            
            /* ========================================= */
            /* STOCHASTIC MIST CONTROLS                  */
            /* ========================================= */
            --mist-brightness: 0.25;    /* Overall brightness of the grains */
            --mist-head-density: 0.55;  /* Density at the top (0.0 to 1.0) */
            --mist-tail-length: 120%;   /* Stretch past 100% to ensure smooth bottom fade */
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: #000000;
        }

        body {
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            background: #000000; 
            color: var(--text);
            font-family: 'Google Sans', 'Product Sans', Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
            text-rendering: geometricPrecision;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
        }

        [hidden] {
            display: none !important;
        }

        /* --- Ambient Background --- */
        .ambient {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .grain {
            position: fixed; 
            inset: 0;
            height: 100vh;
            z-index: 0;
            pointer-events: none;

            /* Microscopic 1px Grain Engine */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 150px 150px;
            
            mix-blend-mode: screen; 
            opacity: var(--mist-brightness); 

            mask-image: radial-gradient(
                ellipse 150% var(--mist-tail-length) at 50% -5%, 
                rgba(0, 0, 0, 1) 0%, 
                rgba(0, 0, 0, var(--mist-head-density)) 35%, 
                rgba(0, 0, 0, 0.08) 70%, 
                transparent 100%
            );
            -webkit-mask-image: radial-gradient(
                ellipse 150% var(--mist-tail-length) at 50% -5%, 
                rgba(0, 0, 0, 1) 0%, 
                rgba(0, 0, 0, var(--mist-head-density)) 35%, 
                rgba(0, 0, 0, 0.08) 70%, 
                transparent 100%
            );
        }

        /* --- Layout Shell --- */
        .shell {
            position: relative;
            z-index: 1;
            width: min(1120px, 100%);
            min-height: 100vh;
            margin: 0 auto;
            padding: clamp(1.25rem, 4vw, 3.5rem);
        }

        .hero {
            display: flex;
            min-height: calc(100vh - clamp(2.5rem, 8vw, 7rem));
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            text-align: center;
            transition: min-height 320ms ease, padding 320ms ease;
        }

        body.has-results .hero {
            min-height: auto;
            padding-top: 0.5rem;
            padding-bottom: 2.2rem;
        }

        /* --- Branding Elements --- */
        .brand {
            margin: 0;
            color: #ffffff; /* Pure white */
            font-size: clamp(3.4rem, 12vw, 6rem);
            font-weight: 300; /* Thin */
            letter-spacing: -0.03em;
            line-height: 0.86;
            transition: font-size 320ms ease;
            
            /* Unselectable */
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }

        body.has-results .brand {
            font-size: clamp(2.4rem, 7vw, 4rem);
        }

        .brand span:last-child {
            color: var(--blue);
        }

        .tagline {
            max-width: 38rem;
            margin: 0 0 1.5rem 0;
            color: var(--muted);
            font-size: clamp(1rem, 2vw, 1.15rem);
            font-weight: 400;
            line-height: 1.7;
            
            /* Unselectable */
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }

        body.has-results .tagline,
        body.has-results .privacy-notice {
            display: none;
        }

        /* --- Search Input UI --- */
        .search-form {
            width: min(720px, 100%);
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #1e1f22; 
            border: 1px solid rgba(173, 216, 230, 0.25); /* Continuous subtle border */
            border-radius: 2rem;
            padding: 0.5rem 0.5rem 0.5rem 1rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            cursor: text; 
            transition: background 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
        }

        .search-box:focus-within {
            background: #232528;
            border-color: var(--blue); /* Full highlight */
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
        }

        .search-icon {
            flex: 0 0 auto;
            width: 1.35rem;
            height: 1.35rem;
            color: var(--muted-soft);
        }

        #query {
            flex: 1;
            min-width: 0;
            border: 0;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 1.1rem;
            padding: 0.8rem 0;
            white-space: nowrap; 
        }

        #query::placeholder {
            color: var(--muted-soft);
        }

        .search-button {
            flex: 0 0 auto;
            cursor: pointer;
            border-radius: 999px;
            background: transparent;
            padding: 0.7rem 1.2rem;
            color: var(--blue);
            font-weight: 600;
            letter-spacing: -0.01em;
            transition: background 180ms ease, color 180ms ease;
        }

        .search-button:hover {
            background: rgba(173, 216, 230, 0.1);
        }

        .search-button:active {
            background: rgba(173, 216, 230, 0.2);
        }

        .privacy-notice {
            margin-top: 1.5rem;
            color: var(--muted-soft);
            font-size: 0.85rem;
            font-weight: 500;
            
            /* Unselectable */
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }

        /* --- Text Formatting (Bold & Italic) --- */
        strong, b {
            color: var(--blue);
            font-weight: 600;
        }

        em, i {
            font-style: italic;
        }

        strong em, em strong, b i, i b {
            color: var(--blue);
            font-weight: 600;
            font-style: italic;
        }

        /* --- Results Area --- */
        .content {
            width: min(860px, 100%);
            margin: 0 auto 5rem;
            display: none;
            flex-direction: column;
            gap: 1.5rem;
        }

        body.has-results .content {
            display: flex;
        }

        .status {
            min-height: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--muted-soft);
            font-size: 0.9rem;
            text-align: center;
        }

        /* --- AI Section --- */
        #ai-section {
            background: var(--bg-soft);
            border: 1px solid rgba(173, 216, 230, 0.25); /* Continuous subtle border */
            border-radius: 1.2rem;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0,0,0, 0.3);
            display: none;
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text);
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .ai-header svg {
            width: 1.2rem;
            height: 1.2rem;
            fill: var(--blue);
        }

        #ai-out {
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            font-size: 1rem;
            /* THIS IS THE FIX: Respects line breaks while rendering HTML */
            white-space: pre-wrap; 
        }

        /* --- Individual Search Results --- */
        #results-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .result-card {
            padding: 0.5rem;
        }

        .result-url {
            color: var(--muted-soft);
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            display: block;
            text-decoration: none;
        }

        .result-title {
            color: var(--google-blue);
            font-size: 1.25rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .result-title:hover {
            text-decoration: underline;
        }

        .result-snippet {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0;
        }

        .pulse {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    
    <!-- Decorative Backgrounds -->
    <div class="ambient">
        <div class="grain"></div>
    </div>

    <div class="shell">
        <main class="hero">
            <h1 class="brand">Neutral<span>.</span></h1>
            <p class="tagline">A minimalist search frontend equipped with intelligent AI overviews.</p>

            <form class="search-form" onsubmit="event.preventDefault(); run();">
                <label class="search-box">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" id="query" placeholder="Search the web..." autocomplete="off" autofocus>
                    <button type="submit" class="search-button">Search</button>
                </label>
            </form>

            <p class="privacy-notice">No Cookies, No stored history, simply private.</p>
        </main>

        <section class="content">
            <div class="status" id="status-text"></div>

            <div id="ai-section">
                <div class="ai-header">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M11.5,1.5L13,8l6.5,1.5L13,11l-1.5,6.5L10,11L3.5,9.5L10,8L11.5,1.5z M18.5,14l0.8,2.7l2.7,0.8l-2.7,0.8l-0.8,2.7l-0.8-2.7L15,17.5l2.7-0.8L18.5,14z"/></svg>
                    AI Overview
                </div>
                <p id="ai-out"></p>
            </div>

            <div id="results-list"></div>
        </section>
    </div>

    <script>
        // Markdown parser for Bold, Italic, and Bold-Italic
        function formatText(text) {
            if (!text) return "";
            return text
                .replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>');
        }

        async function run() {
            const q = document.getElementById('query').value;
            if (!q.trim()) return;

            const resList = document.getElementById('results-list');
            const aiOut = document.getElementById('ai-out');
            const aiSection = document.getElementById('ai-section');
            const statusText = document.getElementById('status-text');

            document.body.classList.add('has-results');
            
            resList.innerHTML = "";
            statusText.innerText = "Fetching results...";
            aiSection.style.display = 'none';

            try {
                // 1. Get Search Results
                const searchRes = await fetch(`/search?q=${encodeURIComponent(q)}&format=json`);
                const data = await searchRes.json();

                if (!data.results || data.results.length === 0) {
                    statusText.innerText = "No results found.";
                    return;
                }

                statusText.innerText = "";

                // 2. Render Results
                resList.innerHTML = data.results.map(r => `
                    <div class="result-card">
                        <span class="result-url">${new URL(r.url).hostname || r.url}</span>
                        <a href="${r.url}" class="result-title">${r.title}</a>
                        <p class="result-snippet">${r.content || r.snippet || 'No snippet available'}</p>
                    </div>
                `).join('');

                // 3. Trigger AI
                aiSection.style.display = 'block';
                aiOut.innerHTML = "<span class='pulse'>Synthesizing overview...</span>";

                const context = data.results.slice(0, 5).map(r => r.content || r.snippet).join("\n");
                
                const aiRes = await fetch('/api/summarize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: q, context: context })
                });

                const aiData = await aiRes.json();
                
                // Parse text and write to innerHTML
                aiOut.innerHTML = formatText(aiData.text) || "AI Error: No text returned";

            } catch (err) {
                statusText.innerText = "";
                resList.innerHTML = `
                    <div class="result-card">
                        <strong style="color: var(--danger);">Fatal Error:</strong> 
                        <span style="color: var(--muted);">${err.message}</span>
                    </div>`;
                console.error(err);
            }
        }
    </script>
</body>
</html>
